<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        margin-top: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        height: 2rem;
        width: 30%;
        margin: auto;
        display: flex;
      }
      #age {
        height: 2rem;
        width: 80%;
      }
      button {
        height: 2.4rem;
        width: 20%;
        background-color: gray;
        border: 1.5px solid black;
        border-radius: 5px;
        color: aliceblue;
        font-weight: 500;
      }
      button:hover {
        background-color: deepskyblue;
      }
      .display-error {
        display: flex;
        align-items: center;
        justify-content: center;
        color: red;
        font-weight: 600;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Create custom error using Tsry and Catch</h1>
    <div class="container">
      <input
        type="text"
        id="age"
        placeholder="Enter age between 18-30"
        name=""
        id=""
      />
      <button onclick="checkAge()" type="submit">submit</button>
    </div>
    <div class="display-error"><p id="error"></p></div>
    <script src="./try-catch.js"></script>
  </body>
</html>
